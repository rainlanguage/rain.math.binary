# Release metadata, not foundry config. `rainix-autopublish` reads `version` as
# the next, unpublished Soldeer release and rewrites it when it publishes.
# `[external.*]` is the section foundry reserves for another tool's config and
# ignores; any other unreserved section it reads as a profile and warns about.
[external.package]
name = "rain-math-binary"
version = "0.1.5"

[profile.default]
src = 'src'
out = 'out'
libs = ['dependencies']

[dependencies]
forge-std = "1.16.1"

[soldeer]
recursive_deps = false

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"

# Try to make sure the optimizer doesn't touch the output in a way that can break
# source maps for debugging.
# via_ir = false
# optimizer = false
# optimizer_runs = 0
# optimizer_steps = 0

# These settings should be used for snapshots
optimizer = true
optimizer_runs = 1000000

bytecode_hash = "none"
cbor_metadata = false

evm_version = "cancun"

[fuzz]
runs = 2048
