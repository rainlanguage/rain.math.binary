# Release metadata, not foundry config. `rainix-autopublish` reads `version` as
# the next, unpublished Soldeer release and rewrites it when it publishes.
# `[external.*]` is the section foundry reserves for another tool's config and
# ignores; any other unreserved section it reads as a profile and warns about.
[external.package]
name = "rain-math-binary"
version = "0.1.5"

# TOML assigns every key to the header above it, so all of foundry's keys sit
# under foundry's headers, ahead of the `[dependencies]` and `[soldeer]`
# sections that belong to soldeer. A key that drifts below one of those headers
# becomes soldeer config and foundry silently falls back to its own default.
# See more config options https://github.com/foundry-rs/foundry/tree/master/config
[profile.default]
src = 'src'
out = 'out'
libs = ['dependencies']

solc = "0.8.25"
evm_version = "cancun"

# Try to make sure the optimizer doesn't touch the output in a way that can break
# source maps for debugging.
# via_ir = false
# optimizer = false
# optimizer_runs = 0
# optimizer_steps = 0

# These settings are used for every build, including snapshots.
optimizer = true
optimizer_runs = 1000000

# No metadata hash in the bytecode, so a build is reproducible byte for byte.
bytecode_hash = "none"
cbor_metadata = false

[fuzz]
runs = 2048

[dependencies]
forge-std = "1.16.1"

[soldeer]
recursive_deps = false
